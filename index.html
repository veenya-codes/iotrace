<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoTrace // IoT Circuit & Wiring CAD Workbench</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            workbench: {
              bg: '#0c0e14',
              canvas: '#0f1118',
              panel: '#161922',
              panelHeader: '#1c202c',
              border: '#2a3040',
              borderLight: '#374154',
              accent: '#3b82f6',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0c0e14;
      color: #94a3b8;
      font-family: 'Inter', sans-serif;
    }

    .workbench-grid {
      background-color: #0b0d13;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.12) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }

    /* Print / Schematic Mode */
    body.print-mode {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    body.print-mode .workbench-grid {
      background-color: #f8fafc !important;
      background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px) !important;
    }
    body.print-mode header,
    body.print-mode aside {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }

    /* Pin Styling - Placed on Top layer so multiple connections are effortless */
    .pin-terminal {
      transition: transform 0.12s ease, filter 0.12s ease;
      cursor: crosshair;
      z-index: 25;
    }
    .pin-terminal:hover {
      transform: scale(1.5);
      filter: drop-shadow(0 0 10px #38bdf8);
      z-index: 99 !important;
    }

    /* Visual badge for pins with multiple branch connections */
    .pin-multi-wire {
      outline: 2px solid #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* Components on canvas */
    .canvas-part {
      touch-action: none;
      cursor: grab;
      transition: outline 0.12s ease, filter 0.12s ease;
    }
    .canvas-part:active {
      cursor: grabbing;
    }
    .canvas-part.selected {
      outline: 2px dashed #38bdf8;
      outline-offset: 4px;
      filter: drop-shadow(0 8px 30px rgba(56, 189, 248, 0.4));
    }

    /* Wires layer is z-15, running OVER board artwork (z-5) and plugging into pins (z-25) */
    .wire-interactive {
      cursor: pointer;
    }
    .wire-interactive:hover .wire-main-stroke {
      stroke-width: 5.5 !important;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
    }
    .wire-selected {
      stroke: #ffffff !important;
      stroke-dasharray: 6 3;
      animation: dash 1s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -18; }
    }

    /* Draggable Waypoint Handles */
    .wire-handle {
      cursor: move;
      transition: transform 0.1s ease, filter 0.1s ease;
      z-index: 40;
    }
    .wire-handle:hover {
      transform: scale(1.4);
      filter: drop-shadow(0 0 8px #38bdf8);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0c0e14; }
    ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
  </style>
</head>
<body class="h-full w-full overflow-hidden select-none flex flex-col">

  <!-- TOP WORKBENCH NAVBAR -->
  <header class="h-14 bg-workbench-panel/95 backdrop-blur-md border-b border-workbench-border flex items-center justify-between px-4 z-30 shadow-lg">
    <!-- Brand Title -->
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400">
        <i data-lucide="cpu" class="w-4 h-4"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-sm font-bold text-slate-100 tracking-wide font-mono">IoTrace</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-blue-500/10 border border-blue-500/30 text-blue-400 font-semibold tracking-wider uppercase">IoT CAD</span>
        </div>
        <p class="text-[10px] text-slate-400">Circuit Interconnect & Wiring Workbench</p>
      </div>
    </div>

    <!-- Center Control Toolbar -->
    <div class="flex items-center space-x-2">
      <!-- Add Component Primary Trigger -->
      <button onclick="openPartModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-md text-xs font-semibold flex items-center space-x-1.5 shadow transition">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Add Component</span>
      </button>

      <div class="h-6 w-px bg-workbench-border mx-1"></div>

      <!-- Multiple Undo & Redo Buttons -->
      <div class="flex items-center space-x-1 bg-workbench-bg p-1 rounded-md border border-workbench-border">
        <button id="btn-undo" onclick="undo()" class="p-1 rounded hover:bg-workbench-border text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition" title="Undo (Ctrl+Z)">
          <i data-lucide="undo-2" class="w-4 h-4"></i>
        </button>
        <button id="btn-redo" onclick="redo()" class="p-1 rounded hover:bg-workbench-border text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition" title="Redo (Ctrl+Y)">
          <i data-lucide="redo-2" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="h-6 w-px bg-workbench-border mx-1"></div>

      <!-- Copy & Paste Toolbar Buttons -->
      <div class="flex items-center space-x-1 bg-workbench-bg p-1 rounded-md border border-workbench-border">
        <button id="btn-copy" onclick="copySelectedComponent()" class="p-1 rounded hover:bg-workbench-border text-slate-300 transition" title="Copy Selected (Ctrl+C)">
          <i data-lucide="copy" class="w-4 h-4"></i>
        </button>
        <button id="btn-paste" onclick="pasteComponent()" class="p-1 rounded hover:bg-workbench-border text-slate-300 transition" title="Paste (Ctrl+V)">
          <i data-lucide="clipboard-paste" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="h-6 w-px bg-workbench-border mx-1"></div>

      <!-- Wire Color Palette Picker -->
      <div class="flex items-center space-x-1.5 bg-workbench-bg px-2.5 py-1 rounded-md border border-workbench-border" title="Select active wire trace color">
        <span class="text-[11px] text-slate-400 font-mono mr-1">Color:</span>
        <div class="flex items-center space-x-1.5" id="wire-color-buttons"></div>
      </div>

      <div class="h-6 w-px bg-workbench-border mx-1"></div>

      <!-- Part Controls -->
      <button onclick="rotateSelectedComponent()" class="p-1.5 rounded-md bg-workbench-bg hover:bg-workbench-border border border-workbench-border text-slate-300 transition" title="Rotate Selected 90° (Hotkey: R)">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
      <button onclick="deleteSelected()" class="p-1.5 rounded-md bg-workbench-bg hover:bg-red-950/40 border border-workbench-border hover:border-red-500/40 text-slate-300 hover:text-red-400 transition" title="Delete Selected (Hotkey: Del)">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
      <button onclick="clearWorkbench()" class="p-1.5 rounded-md bg-workbench-bg hover:bg-workbench-border border border-workbench-border text-slate-300 transition" title="Clear Canvas">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center space-x-2">
      <button onclick="toggleNetlistDrawer()" id="netlist-btn" class="px-2.5 py-1.5 rounded-md bg-workbench-bg hover:bg-workbench-border border border-workbench-border text-slate-200 text-xs flex items-center space-x-1.5 transition">
        <i data-lucide="list-checks" class="w-4 h-4 text-emerald-400"></i>
        <span class="hidden md:inline font-mono">Netlist</span>
        <span id="wire-count-badge" class="px-1.5 py-0.2 text-[10px] bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 rounded-full font-mono">0</span>
      </button>

      <button onclick="togglePrintMode()" id="print-mode-btn" class="p-1.5 rounded-md bg-workbench-bg hover:bg-workbench-border border border-workbench-border text-slate-300 transition" title="Toggle Print / Schematic View">
        <i data-lucide="printer" class="w-4 h-4"></i>
      </button>

      <button onclick="exportDiagramPNG()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-semibold flex items-center space-x-1.5 transition shadow">
        <i data-lucide="camera" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Export PNG</span>
      </button>
    </div>
  </header>

  <!-- WORKBENCH BODY: CANVAS + SIDE DRAWERS -->
  <div class="flex-1 relative flex overflow-hidden">

    <!-- FLOATING CANVAS CONTROLS (BOTTOM-LEFT) -->
    <div class="absolute bottom-4 left-4 z-20 flex items-center space-x-1.5 bg-workbench-panel/90 backdrop-blur-md border border-workbench-border rounded-lg p-1 shadow-xl text-slate-300">
      <button onclick="zoomCanvas(0.1)" class="p-1.5 hover:bg-workbench-border rounded transition" title="Zoom In">
        <i data-lucide="zoom-in" class="w-4 h-4"></i>
      </button>
      <span id="zoom-indicator" class="px-2 text-xs font-mono text-slate-200">100%</span>
      <button onclick="zoomCanvas(-0.1)" class="p-1.5 hover:bg-workbench-border rounded transition" title="Zoom Out">
        <i data-lucide="zoom-out" class="w-4 h-4"></i>
      </button>
      <div class="w-px h-4 bg-workbench-border mx-1"></div>
      <button onclick="resetCanvasView()" class="p-1.5 hover:bg-workbench-border rounded transition" title="Recenter Workbench View">
        <i data-lucide="crosshair" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- WIRING HINT TOAST (BOTTOM-CENTER) -->
    <div id="wiring-banner" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-200 bg-slate-900/95 border border-slate-700 px-4 py-2 rounded-full text-xs font-mono text-slate-200 shadow-2xl flex items-center space-x-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      <span id="wiring-banner-text">Auto-saving to LocalStorage enabled. Click pin to wire. Shift+Drag to box select.</span>
    </div>

    <!-- MAIN INTERACTIVE CANVAS VIEWPORT -->
    <div id="viewport-container" class="w-full h-full workbench-grid relative overflow-hidden cursor-crosshair select-none">
      
      <!-- Scalable & Pannable Matrix Space -->
      <div id="canvas-world" class="absolute inset-0 origin-top-left will-change-transform">
        
        <!-- LAYER 1: BOARD BODIES / SVGs (z-5) -->
        <div id="components-layer" class="absolute inset-0 pointer-events-none" style="z-index: 5;"></div>

        <!-- LAYER 2: WIRES OVER BOARDS (z-15) - Traces run visibly OVER the boards from top of pins -->
        <svg id="wires-layer" class="absolute inset-0 overflow-visible pointer-events-none w-full h-full" style="z-index: 15;">
          <g id="wires-group"></g>
          <path id="rubber-wire" class="hidden" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          <g id="waypoint-markers"></g>
          <g id="wire-handles-group" class="pointer-events-auto"></g>
        </svg>

        <!-- LAYER 3: CLICKABLE PIN TERMINALS (z-25) - Pins receive all clicks above wires -->
        <div id="pins-interaction-layer" class="absolute inset-0 pointer-events-none" style="z-index: 25;"></div>

        <!-- LAYER 4: MARQUEE SELECTION BOX (z-50) -->
        <div id="marquee-box" class="absolute border-2 border-dashed border-cyan-400 bg-cyan-500/20 pointer-events-none hidden z-50"></div>

      </div>

    </div>

    <!-- RIGHT SLIDE-OUT: CONNECTION TABLE -->
    <aside id="netlist-drawer" class="absolute top-0 right-0 bottom-0 w-80 bg-workbench-panel border-l border-workbench-border z-30 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-200 ease-in-out">
      <div class="h-14 bg-workbench-panelHeader border-b border-workbench-border px-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i data-lucide="git-commit" class="w-4 h-4 text-emerald-400"></i>
          <span class="text-xs font-bold text-slate-100 uppercase tracking-wider">Wiring Interconnects</span>
        </div>
        <button onclick="toggleNetlistDrawer()" class="p-1 hover:bg-workbench-border rounded text-slate-400 hover:text-slate-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-2" id="netlist-container"></div>

      <div class="p-3 bg-workbench-panelHeader border-t border-workbench-border text-[11px] font-mono text-slate-400 flex items-center justify-between">
        <span id="netlist-summary">0 Connections</span>
        <button onclick="copyNetlistText()" class="text-blue-400 hover:text-blue-300 font-sans text-xs flex items-center space-x-1">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span>Copy Table</span>
        </button>
      </div>
    </aside>

  </div>

  <!-- MODAL: ADD COMPONENT DIALOG -->
  <div id="part-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden">
    <div class="bg-workbench-panel border border-workbench-borderLight rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
      
      <div class="p-4 bg-workbench-panelHeader border-b border-workbench-border flex items-center justify-between">
        <div class="flex items-center space-x-3 flex-1 mr-4">
          <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
          <input type="text" id="part-search-input" oninput="filterPartCatalog()" placeholder="Search components (Matrix Keypad, Wemos, Pushbutton, Oscilloscope, Bluepill)..." class="w-full bg-workbench-bg border border-workbench-border rounded-lg px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>
        <button onclick="closePartModal()" class="p-1.5 rounded-lg hover:bg-workbench-border text-slate-400 hover:text-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="px-4 py-2 border-b border-workbench-border flex space-x-2 text-xs overflow-x-auto bg-workbench-bg/50">
        <button onclick="setCategoryFilter('all')" class="cat-pill active px-3 py-1 rounded-full bg-blue-600 text-white font-medium">All Hardware</button>
        <button onclick="setCategoryFilter('mcu')" class="cat-pill px-3 py-1 rounded-full bg-workbench-panel hover:bg-workbench-border text-slate-300">Microcontrollers</button>
        <button onclick="setCategoryFilter('instrument')" class="cat-pill px-3 py-1 rounded-full bg-workbench-panel hover:bg-workbench-border text-slate-300">Instruments</button>
        <button onclick="setCategoryFilter('sensor')" class="cat-pill px-3 py-1 rounded-full bg-workbench-panel hover:bg-workbench-border text-slate-300">Sensors & Display</button>
        <button onclick="setCategoryFilter('discrete')" class="cat-pill px-3 py-1 rounded-full bg-workbench-panel hover:bg-workbench-border text-slate-300">Switches & Passives</button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 grid grid-cols-1 sm:grid-cols-2 gap-3" id="part-catalog-grid"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. HARDWARE COMPONENT DEFINITIONS WITH AUTHENTIC PINOUTS
       ========================================================================== */
    const WIRE_PALETTE = [
      { id: 'red', hex: '#ef4444', name: 'Power (+5V / +3.3V)' },
      { id: 'black', hex: '#1e293b', name: 'Ground (GND)' },
      { id: 'green', hex: '#22c55e', name: 'Signal (GPIO)' },
      { id: 'orange', hex: '#f97316', name: 'Data / Bus' },
      { id: 'blue', hex: '#3b82f6', name: 'Communication' },
      { id: 'yellow', hex: '#eab308', name: 'Clock (SCL/SCK)' },
      { id: 'purple', hex: '#a855f7', name: 'Control' }
    ];

    function createNucleoDefinition(id, name, partNumber, freqText) {
      const w = 380;
      const h = 470;
      const pins = [];

      for (let i = 0; i < 19; i++) {
        const py = 160 + i * 15;
        pins.push({ id: `cn7_l_${i}`, name: `PC${i*2}`, label: `PC${i*2}`, type: 'GPIO', x: 17, y: py, side: 'left' });
        pins.push({ id: `cn7_r_${i}`, name: `PC${i*2+1}`, label: `PC${i*2+1}`, type: 'GPIO', x: 31, y: py, side: 'left' });
      }

      for (let i = 0; i < 19; i++) {
        const py = 160 + i * 15;
        pins.push({ id: `cn10_l_${i}`, name: `PB${i*2}`, label: `PB${i*2}`, type: 'GPIO', x: 349, y: py, side: 'right' });
        pins.push({ id: `cn10_r_${i}`, name: `PB${i*2+1}`, label: `PB${i*2+1}`, type: 'GPIO', x: 363, y: py, side: 'right' });
      }

      const leftPwr = ["NC", "IOREF", "NRST", "3V3", "5V", "GND", "GND", "VIN"];
      leftPwr.forEach((lbl, i) => {
        pins.push({ id: `ard_pwr_${i}`, name: lbl, label: lbl, type: lbl.includes("GND") ? "GND" : (lbl.includes("V") ? "PWR" : "ADC"), x: 61, y: 175 + i * 16, side: 'right' });
      });

      const leftAnalog = ["A0", "A1", "A2", "A3", "A4", "A5"];
      leftAnalog.forEach((lbl, i) => {
        pins.push({ id: `ard_ana_${i}`, name: lbl, label: lbl, type: "ADC", x: 61, y: 320 + i * 16, side: 'right' });
      });

      const rightDigHigh = ["D15", "D14", "AVDD", "GND", "D13", "D12", "D11", "D10", "D9", "D8"];
      rightDigHigh.forEach((lbl, i) => {
        pins.push({ id: `ard_digh_${i}`, name: lbl, label: lbl, type: lbl.includes("GND") ? "GND" : (lbl.includes("AVDD") ? "PWR" : "GPIO"), x: 319, y: 160 + i * 15, side: 'left' });
      });

      const rightDigLow = ["D7", "D6", "D5", "D4", "D3", "D2", "D1", "D0"];
      rightDigLow.forEach((lbl, i) => {
        pins.push({ id: `ard_digl_${i}`, name: lbl, label: lbl, type: "GPIO", x: 319, y: 325 + i * 15, side: 'left' });
      });

      return {
        id,
        name,
        category: 'mcu',
        partNumber,
        desc: `STMicroelectronics ARM Cortex-M4 Nucleo-64 (${freqText}) with properly aligned Morpho and Arduino headers.`,
        width: w,
        height: h,
        pins,
        renderSVG: () => `
          <g>
            <rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="#eef0f3" stroke="#94a3b8" stroke-width="2"/>
            <rect x="${w/2 - 26}" y="4" width="52" height="24" rx="2" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
            <rect x="${w/2 - 18}" y="10" width="36" height="12" fill="#1e293b" rx="1"/>
            <rect x="${w/2 - 36}" y="40" width="72" height="42" rx="3" fill="#181d24"/>
            <text x="${w/2}" y="62" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#cbd5e1" text-anchor="middle">ST-LINK</text>
            <text x="${w/2}" y="74" font-family="'JetBrains Mono', monospace" font-size="6" fill="#64748b" text-anchor="middle">V2-1 DEBUGGER</text>
            <line x1="8" y1="100" x2="${w-8}" y2="100" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
            <text x="${w/2}" y="120" font-family="'Inter', sans-serif" font-size="12" fill="#1e293b" font-weight="bold" text-anchor="middle" letter-spacing="1">${name.toUpperCase()}</text>
            <text x="${w/2}" y="134" font-family="'JetBrains Mono', monospace" font-size="7" fill="#64748b" text-anchor="middle">${partNumber} ${freqText}</text>
            <circle cx="110" cy="165" r="9" fill="#2563eb"/>
            <text x="110" y="184" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#1e293b" text-anchor="middle">B1 USER</text>
            <circle cx="270" cy="165" r="9" fill="#1e293b"/>
            <text x="270" y="184" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#1e293b" text-anchor="middle">B2 RESET</text>
            <g transform="translate(${w/2 - 35}, 225)">
              <rect x="0" y="0" width="70" height="70" rx="4" fill="#181d24" stroke="#334155" stroke-width="1.5"/>
              <text x="35" y="32" font-family="'Inter', sans-serif" font-size="8.5" fill="#f8fafc" font-weight="bold" text-anchor="middle">STM32</text>
              <text x="35" y="46" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#38bdf8" text-anchor="middle">${partNumber.replace('STM32', '')}</text>
            </g>
            <rect x="10" y="150" width="28" height="295" rx="2" fill="#181a20" stroke="#334155"/>
            <text x="24" y="145" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#64748b" text-anchor="middle">CN7</text>
            <rect x="342" y="150" width="28" height="295" rx="2" fill="#181a20" stroke="#334155"/>
            <text x="356" y="145" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#64748b" text-anchor="middle">CN10</text>
            <rect x="54" y="165" width="14" height="135" rx="2" fill="#181a20" stroke="#334155"/>
            <text x="61" y="158" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#0369a1" text-anchor="middle">PWR</text>
            <rect x="54" y="310" width="14" height="105" rx="2" fill="#181a20" stroke="#334155"/>
            <text x="61" y="305" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#0369a1" text-anchor="middle">ANALOG</text>
            <rect x="312" y="150" width="14" height="158" rx="2" fill="#181a20" stroke="#334155"/>

    /* ==========================================================================
       2. WORKBENCH STATE ENGINE, UNDO / REDO & PERSISTENT LOCAL STORAGE

    const history = {
      past: [],
      future: []
    };

    let clipboard = null;

    const state = {
      panX: 40,
      panY: 40,
      zoom: 1.0,
      isPanning: false,
      panStart: { x: 0, y: 0 },
      dragComponent: null,
      dragOffset: { x: 0, y: 0 },
      dragInitialSnap: null,
      dragHandle: null,
      activeWireColor: 'red',

      selectedEntity: null,
      isDraggingGroup: false,
      dragStartMouse: { x: 0, y: 0 },
      dragCompStarts: [],
      isMarquee: false,
      marqueeStart: { x: 0, y: 0 },
      components: [],
      wires: [],
      lastMouseWorld: { x: 200, y: 200 },
      printMode: false
    };

    const STORAGE_KEY = 'iotrace_circuit_autosave_v1';

    const viewportContainer = document.getElementById('viewport-container');
    const canvasWorld = document.getElementById('canvas-world');
    const wiresLayer = document.getElementById('wires-layer');
    const wiresGroup = document.getElementById('wires-group');
    const rubberWire = document.getElementById('rubber-wire');
    const waypointMarkers = document.getElementById('waypoint-markers');
    const wireHandlesGroup = document.getElementById('wire-handles-group');
    const componentsLayer = document.getElementById('components-layer');
    const pinsInteractionLayer = document.getElementById('pins-interaction-layer');
    const marqueeBox = document.getElementById('marquee-box');
    const zoomIndicator = document.getElementById('zoom-indicator');
    const wiringBanner = document.getElementById('wiring-banner');
    const wiringBannerText = document.getElementById('wiring-banner-text');
    const wireCountBadge = document.getElementById('wire-count-badge');
    const netlistContainer = document.getElementById('netlist-container');
    const netlistSummary = document.getElementById('netlist-summary');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');

    function getCircuitSnapshot() {
      return JSON.stringify({
        components: state.components,
        wires: state.wires
      });
    }

    function saveHistory() {
      const snap = getCircuitSnapshot();
      if (history.past.length > 0 && history.past[history.past.length - 1] === snap) return;
      history.past.push(snap);
      if (history.past.length > 100) history.past.shift();
      history.future = [];
      updateUndoRedoButtons();
      persistToLocalStorage();
    }

    function persistToLocalStorage() {
      try {
        const data = {
          components: state.components,
          wires: state.wires
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }

    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);
          if (data && data.components && Array.isArray(data.components)) {
            return data;
          }
        }
      } catch (e) {
        console.warn('LocalStorage load failed:', e);
      }
      return null;
    }

    function updateUndoRedoButtons() {
      if (btnUndo) {
        btnUndo.disabled = (history.past.length === 0);
        btnUndo.title = `Undo (${history.past.length} step${history.past.length === 1 ? '' : 's'}) [Ctrl+Z]`;
      }
      if (btnRedo) {
        btnRedo.disabled = (history.future.length === 0);
        btnRedo.title = `Redo (${history.future.length} step${history.future.length === 1 ? '' : 's'}) [Ctrl+Y]`;
      }
    }

    function applyCircuitState(data) {
      componentsLayer.innerHTML = '';
      pinsInteractionLayer.innerHTML = '';
      state.components = data.components || [];
      state.wires = data.wires || [];
      state.components.forEach(c => renderComponentDOM(c));
      renderWires();
      selectEntity(null);
      updateNetlistUI();
      updateUndoRedoButtons();
      persistToLocalStorage();
    }

    function undo() {
      if (history.past.length === 0) return;
      history.future.push(getCircuitSnapshot());
      const prev = JSON.parse(history.past.pop());
      applyCircuitState(prev);
      setBannerText(`Undo applied. (${history.past.length} steps remaining)`);
    }

    function redo() {
      if (history.future.length === 0) return;
      history.past.push(getCircuitSnapshot());
      const next = JSON.parse(history.future.pop());
      applyCircuitState(next);
      setBannerText(`Redo applied. (${history.future.length} steps ahead)`);
    }

    // COPY & PASTE FEATURE
    function copySelectedComponent() {
      if (state.selectedCompIds.length === 0) {
        setBannerText("Select one or more components first to copy.");
        return;
      }

      const compsToCopy = state.components.filter(c => state.selectedCompIds.includes(c.id));
      if (compsToCopy.length === 0) return;

      const minX = Math.min(...compsToCopy.map(c => c.x));
      const minY = Math.min(...compsToCopy.map(c => c.y));

      clipboard = {
        components: compsToCopy.map(c => ({
          catalogId: c.catalogId,
          customName: c.customName,
          relX: c.x - minX,
          relY: c.y - minY,
          rotation: c.rotation || 0
        })),
        internalWires: state.wires.filter(w =>
          state.selectedCompIds.includes(w.from.compId) && state.selectedCompIds.includes(w.to.compId)
        ).map(w => ({
          fromCompIndex: compsToCopy.findIndex(c => c.id === w.from.compId),
          fromPinId: w.from.pinId,
          toCompIndex: compsToCopy.findIndex(c => c.id === w.to.compId),
          toPinId: w.to.pinId,
          color: w.color,
          manualWaypoints: w.manualWaypoints ? w.manualWaypoints.map(pt => ({ relX: pt.x - minX, relY: pt.y - minY })) : null
        })),
        originX: minX + 30,
        originY: minY + 30
      };

      setBannerText(`Copied ${compsToCopy.length} component(s) to clipboard! (Ctrl+V to paste)`);
    }

    function pasteComponent() {
      if (!clipboard || !clipboard.components || clipboard.components.length === 0) {
        setBannerText("Clipboard is empty. Select component(s) and press Ctrl+C first.");
        return;
      }

      saveHistory();

      let originX, originY;
      if (state.lastMouseWorld && state.lastMouseWorld.x > 0 && state.lastMouseWorld.y > 0) {
        originX = snap(state.lastMouseWorld.x, 10);
        originY = snap(state.lastMouseWorld.y, 10);
      } else {
        originX = snap(clipboard.originX, 10);
        originY = snap(clipboard.originY, 10);
      }

      const newCompIds = [];
      const idMap = {};

      clipboard.components.forEach((item, idx) => {
        const newId = 'comp_' + Math.random().toString(36).substring(2, 9);
        idMap[idx] = newId;
        newCompIds.push(newId);

        const newComp = {
          id: newId,
          catalogId: item.catalogId,
          customName: item.customName,
          x: originX + item.relX,
          y: originY + item.relY,
          rotation: item.rotation || 0
        };

        state.components.push(newComp);
        renderComponentDOM(newComp);
      });

      if (clipboard.internalWires) {
        clipboard.internalWires.forEach(wire => {
          const newFromId = idMap[wire.fromCompIndex];
          const newToId = idMap[wire.toCompIndex];
          if (newFromId && newToId) {
            state.wires.push({
              id: 'wire_' + Math.random().toString(36).substring(2, 9),
              from: { compId: newFromId, pinId: wire.fromPinId },
              to: { compId: newToId, pinId: wire.toPinId },
              color: wire.color,
              manualWaypoints: wire.manualWaypoints ? wire.manualWaypoints.map(pt => ({ x: originX + pt.relX, y: originY + pt.relY })) : null
            });
          }
        });
      }

      clipboard.originX += 30;
      clipboard.originY += 30;

      state.selectedCompIds = newCompIds;
      updateSelectionVisuals();
      renderWires();
      updateNetlistUI();
      persistToLocalStorage();
      setBannerText(`Pasted ${newCompIds.length} component(s). Drag to move together.`);
    }

    /* ==========================================================================
       3. CANVAS MECHANICS (PAN, ZOOM, GRID SNAP)
       ========================================================================== */
    function updateTransform() {
      canvasWorld.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      zoomIndicator.textContent = `${Math.round(state.zoom * 100)}%`;
      const bgZoom = 20 * state.zoom;
      viewportContainer.style.backgroundSize = `${bgZoom}px ${bgZoom}px`;
      viewportContainer.style.backgroundPosition = `${state.panX}px ${state.panY}px`;
    }

    function screenToWorld(clientX, clientY) {
      const rect = viewportContainer.getBoundingClientRect();
      return {
        x: (clientX - rect.left - state.panX) / state.zoom,
        y: (clientY - rect.top - state.panY) / state.zoom
      };
    }

    function snap(val, step = 10) {
      return Math.round(val / step) * step;
    }

    function zoomCanvas(delta) {
      const newZoom = Math.min(Math.max(state.zoom + delta, 0.4), 2.2);
      state.zoom = Number(newZoom.toFixed(2));
      updateTransform();
    }

    function resetCanvasView() {
      state.panX = 50;
      state.panY = 40;
      state.zoom = 1.0;
      updateTransform();
    }

    /* ==========================================================================
       4. STRICT MANHATTAN 90° WIRING ENGINE
       ========================================================================== */
    function calculateManhattanSegment(lastPt, mouse, forcedAxis) {
      const mx = snap(mouse.x, 10);
      const my = snap(mouse.y, 10);

      if (forcedAxis === 'H') {
        return { point: { x: mx, y: lastPt.y }, axis: 'H' };
      }
      if (forcedAxis === 'V') {
        return { point: { x: lastPt.x, y: my }, axis: 'V' };
      }

      const dx = Math.abs(mx - lastPt.x);
      const dy = Math.abs(my - lastPt.y);
      if (dx >= dy) {
        return { point: { x: mx, y: lastPt.y }, axis: 'H' };
      } else {
        return { point: { x: lastPt.x, y: my }, axis: 'V' };
      }
    }

    function pointsToSmoothPath(pts, radius = 10) {
      if (!pts || pts.length < 2) return '';
      if (pts.length === 2) {
        return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
      }

      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const next = pts[i + 1];

        const d1x = curr.x - prev.x;
        const d1y = curr.y - prev.y;
        const len1 = Math.hypot(d1x, d1y);

        const d2x = next.x - curr.x;
        const d2y = next.y - curr.y;
        const len2 = Math.hypot(d2x, d2y);

        const r = Math.min(radius, len1 / 2, len2 / 2);

        if (r < 1) {
          d += ` L ${curr.x} ${curr.y}`;
          continue;
        }

        const startX = curr.x - (d1x / len1) * r;
        const startY = curr.y - (d1y / len1) * r;
        const endX = curr.x + (d2x / len2) * r;
        const endY = curr.y + (d2y / len2) * r;

        d += ` L ${startX} ${startY} Q ${curr.x} ${curr.y} ${endX} ${endY}`;
      }
      d += ` L ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
      return d;
    }

    function updateRubberWire(mouse) {
      if (!state.wiring) return;
      const waypoints = state.wiring.waypoints;
      const lastPt = waypoints[waypoints.length - 1];

      const { point, axis } = calculateManhattanSegment(lastPt, mouse, state.wiring.forcedAxis);
      state.wiring.currentCandidate = point;
      state.wiring.currentAxis = axis;

      const fullPts = [...waypoints, point];
      const d = pointsToSmoothPath(fullPts, 10);
      const colHex = WIRE_PALETTE.find(c => c.id === state.activeWireColor)?.hex || '#ef4444';
      rubberWire.setAttribute('d', d);
      rubberWire.setAttribute('stroke', colHex);
      rubberWire.classList.remove('hidden');
    }

    function renderWaypointMarkers() {
      waypointMarkers.innerHTML = '';
      if (!state.wiring) return;
      state.wiring.waypoints.forEach((pt, i) => {
        if (i === 0) return;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pt.x);
        c.setAttribute('cy', pt.y);
        c.setAttribute('r', '4');
        c.setAttribute('fill', '#38bdf8');
        c.setAttribute('stroke', '#0f172a');
        c.setAttribute('stroke-width', '1.5');
        waypointMarkers.appendChild(c);
      });
    }

    function renderWireHandles(wire) {
      wireHandlesGroup.innerHTML = '';
      if (!wire || !wire.manualWaypoints || wire.manualWaypoints.length <= 2) return;

      for (let i = 1; i < wire.manualWaypoints.length - 1; i++) {
        const pt = wire.manualWaypoints[i];
        const h = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        h.setAttribute('cx', pt.x);
        h.setAttribute('cy', pt.y);
        h.setAttribute('r', '6');
        h.setAttribute('fill', '#38bdf8');
        h.setAttribute('stroke', '#ffffff');
        h.setAttribute('stroke-width', '2');
        h.setAttribute('class', 'wire-handle');
        h.title = "Drag corner to adjust layout";

        h.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          state.dragHandle = { wireId: wire.id, index: i, initialSnap: getCircuitSnapshot() };
        });

        wireHandlesGroup.appendChild(h);
      }
    }

    function getPinAbsoluteCoords(compId, pinId) {
      const comp = state.components.find(c => c.id === compId);
      if (!comp) return null;
      const cat = CATALOG.find(item => item.id === comp.catalogId);
      if (!cat) return null;
      const pin = cat.pins.find(p => p.id === pinId);
      if (!pin) return null;

      const rad = (comp.rotation || 0) * Math.PI / 180;
      const cx = cat.width / 2;
      const cy = cat.height / 2;

      const rx = (pin.x - cx) * Math.cos(rad) - (pin.y - cy) * Math.sin(rad) + cx;
      const ry = (pin.x - cx) * Math.sin(rad) + (pin.y - cy) * Math.cos(rad) + cy;

      return {
        x: comp.x + rx,
        y: comp.y + ry,
        name: pin.name,
        label: pin.label,
        type: pin.type,
        compName: comp.customName || cat.name
      };
    }

    function handlePinClick(compId, pinId, e) {
      e.stopPropagation();
      const coords = getPinAbsoluteCoords(compId, pinId);
      if (!coords) return;

      if (!state.wiring) {
        state.wiring = {
          fromComp: compId,
          fromPin: pinId,
          waypoints: [{ x: coords.x, y: coords.y }],
          forcedAxis: null,
          currentCandidate: null
        };
        rubberWire.classList.remove('hidden');
        renderWaypointMarkers();
        setBannerText(`Wiring from: ${coords.compName} [${coords.name}]. Click on canvas to anchor 90° turns!`);
        return;
      }

      if (state.wiring.fromComp === compId && state.wiring.fromPin === pinId) {
        cancelWiring();
        return;
      }

      saveHistory();

      const pts = [...state.wiring.waypoints];
      const lastPt = pts[pts.length - 1];
      const targetPt = { x: coords.x, y: coords.y };

      if (state.wiring.forcedAxis === 'H') {
        pts.push({ x: targetPt.x, y: lastPt.y });
      } else if (state.wiring.forcedAxis === 'V') {
        pts.push({ x: lastPt.x, y: targetPt.y });
      } else {
        const dx = Math.abs(targetPt.x - lastPt.x);
        const dy = Math.abs(targetPt.y - lastPt.y);
        if (dx >= dy) {
          pts.push({ x: targetPt.x, y: lastPt.y });
        } else {
          pts.push({ x: lastPt.x, y: targetPt.y });
        }
      }
      pts.push(targetPt);

      const newWire = {
        id: 'wire_' + Date.now(),
        from: { compId: state.wiring.fromComp, pinId: state.wiring.fromPin },
        to: { compId, pinId },
        color: state.activeWireColor,
        manualWaypoints: pts
      };

      state.wires.push(newWire);
      cancelWiring();
      renderWires();
      updatePinBadges();
      updateNetlistUI();
      selectEntity('wire', newWire.id);
      setBannerText(`Wire connected! Multiple traces to same pin active.`);
      setTimeout(() => setBannerText('Shift+Click or Shift+Drag to multi-select. Drag group to move together.'), 2500);
    }

    function cancelWiring() {
      state.wiring = null;
      rubberWire.classList.add('hidden');
      rubberWire.setAttribute('d', '');
      waypointMarkers.innerHTML = '';
      setBannerText('Shift+Click or Shift+Drag to multi-select. Drag group to move together.');
    }

    function setBannerText(text) {
      wiringBannerText.textContent = text;
    }

    function getWireRenderPoints(wire) {
      const from = getPinAbsoluteCoords(wire.from.compId, wire.from.pinId);
      const to = getPinAbsoluteCoords(wire.to.compId, wire.to.pinId);
      if (!from || !to) return null;

      if (wire.manualWaypoints && wire.manualWaypoints.length >= 2) {
        const pts = [...wire.manualWaypoints];
        pts[0] = { x: from.x, y: from.y };
        pts[pts.length - 1] = { x: to.x, y: to.y };
        return pts;
      }

      const dx = Math.abs(to.x - from.x);
      const dy = Math.abs(to.y - from.y);
      const mid = dx >= dy ? { x: to.x, y: from.y } : { x: from.x, y: to.y };
      return [{ x: from.x, y: from.y }, mid, { x: to.x, y: to.y }];
    }

    function renderWires() {
      wiresGroup.innerHTML = '';

      state.wires.forEach(wire => {
        const points = getWireRenderPoints(wire);
        if (!points) return;

        const pathData = pointsToSmoothPath(points, 10);
        const hex = WIRE_PALETTE.find(c => c.id === wire.color)?.hex || '#ef4444';
        const isSelected = state.selectedEntity?.type === 'wire' && state.selectedEntity.id === wire.id;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'wire-interactive pointer-events-auto');
        g.onclick = (e) => {
          e.stopPropagation();
          selectEntity('wire', wire.id);
        };

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', pathData);
        hit.setAttribute('fill', 'none');
        hit.setAttribute('stroke', 'transparent');
        hit.setAttribute('stroke-width', '16');

        const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        shadow.setAttribute('d', pathData);
        shadow.setAttribute('fill', 'none');
        shadow.setAttribute('stroke', '#000000');
        shadow.setAttribute('stroke-width', '5.5');
        shadow.setAttribute('stroke-opacity', '0.5');
        shadow.setAttribute('stroke-linecap', 'round');
        shadow.setAttribute('stroke-linejoin', 'round');
        shadow.setAttribute('pointer-events', 'none');

        const trace = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        trace.setAttribute('d', pathData);
        trace.setAttribute('fill', 'none');
        trace.setAttribute('stroke', state.printMode && wire.color === 'black' ? '#000000' : hex);
        trace.setAttribute('stroke-width', '3.5');
        trace.setAttribute('stroke-linecap', 'round');
        trace.setAttribute('stroke-linejoin', 'round');
        trace.setAttribute('class', `wire-main-stroke ${isSelected ? 'wire-selected' : ''}`);
        trace.setAttribute('pointer-events', 'none');

        const p1 = points[0];
        const p2 = points[points.length - 1];

        const dot1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot1.setAttribute('cx', p1.x);
        dot1.setAttribute('cy', p1.y);
        dot1.setAttribute('r', '4');
        dot1.setAttribute('fill', hex);
        dot1.setAttribute('stroke', '#0f172a');
        dot1.setAttribute('stroke-width', '1.5');
        dot1.setAttribute('pointer-events', 'none');

        const dot2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot2.setAttribute('cx', p2.x);
        dot2.setAttribute('cy', p2.y);
        dot2.setAttribute('r', '4');
        dot2.setAttribute('fill', hex);
        dot2.setAttribute('stroke', '#0f172a');
        dot2.setAttribute('stroke-width', '1.5');
        dot2.setAttribute('pointer-events', 'none');

        g.appendChild(hit);
        g.appendChild(shadow);
        g.appendChild(trace);
        g.appendChild(dot1);
        g.appendChild(dot2);
        wiresGroup.appendChild(g);
      });

      wireCountBadge.textContent = state.wires.length;
      updatePinBadges();
      persistToLocalStorage();
    }

    function updatePinBadges() {
      const pinCounts = {};
      state.wires.forEach(w => {
        const k1 = `${w.from.compId}:${w.from.pinId}`;
        const k2 = `${w.to.compId}:${w.to.pinId}`;
        pinCounts[k1] = (pinCounts[k1] || 0) + 1;
        pinCounts[k2] = (pinCounts[k2] || 0) + 1;
      });

      document.querySelectorAll('.pin-terminal').forEach(el => {
        const compId = el.dataset.compId;
        const pinId = el.dataset.pinId;
        const count = pinCounts[`${compId}:${pinId}`] || 0;
        if (count >= 2) {
          el.classList.add('pin-multi-wire');
        } else {
          el.classList.remove('pin-multi-wire');
        }
      });
    }

    function updateSelectionVisuals() {
      state.components.forEach(c => {
        const el = document.getElementById(`part-${c.id}`);
        if (el) {
          if (state.selectedCompIds.includes(c.id)) {
            el.classList.add('selected');
          } else {
            el.classList.remove('selected');
          }
        }
      });

      if (state.selectedCompIds.length > 1) {
        setBannerText(`${state.selectedCompIds.length} components selected. Drag to move together, Ctrl+C to copy.`);
      } else if (state.selectedCompIds.length === 1) {
        const singleComp = state.components.find(c => c.id === state.selectedCompIds[0]);
        setBannerText(`Selected ${singleComp?.customName || 'component'}. Drag to move, Ctrl+C to copy.`);
      }
    }

    /* ==========================================================================
       CANVAS POINTER & MARQUEE BOX SELECTION EVENTS
       ========================================================================== */
    viewportContainer.addEventListener('mousedown', (e) => {
      if (e.target.closest('.pin-terminal')) return;

      if (state.wiring && e.button === 0) {
        const candidate = state.wiring.currentCandidate;
        if (candidate) {
          state.wiring.waypoints.push({ ...candidate });
          state.wiring.forcedAxis = (state.wiring.currentAxis === 'H') ? 'V' : 'H';
          renderWaypointMarkers();
          setBannerText(`Turn anchored! Next segment locked to ${state.wiring.forcedAxis === 'H' ? 'Horizontal' : 'Vertical'} (90° turn).`);
        }
        return;
      }

      if (e.shiftKey && e.button === 0 && !state.wiring) {
        const mouse = screenToWorld(e.clientX, e.clientY);
        state.isMarquee = true;
        state.marqueeStart = mouse;
        marqueeBox.style.left = `${mouse.x}px`;
        marqueeBox.style.top = `${mouse.y}px`;
        marqueeBox.style.width = '0px';
        marqueeBox.style.height = '0px';
        marqueeBox.classList.remove('hidden');
        return;
      }

      if (e.button === 0 && !e.shiftKey && !e.target.closest('.canvas-part') && !e.target.closest('.wire-interactive')) {
        state.selectedCompIds = [];
        selectEntity(null);
        updateSelectionVisuals();
      }

      if (e.button === 1 || e.button === 2 || (e.button === 0 && !state.wiring && !e.shiftKey && !e.target.closest('.canvas-part'))) {
        state.isPanning = true;
        state.panStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
        viewportContainer.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('contextmenu', (e) => {
      if (e.target.closest('#viewport-container')) {
        e.preventDefault();
        if (state.wiring) {
          if (state.wiring.waypoints.length > 1) {
            state.wiring.waypoints.pop();
            state.wiring.forcedAxis = (state.wiring.forcedAxis === 'H') ? 'V' : 'H';
            renderWaypointMarkers();
            const mouse = screenToWorld(e.clientX, e.clientY);
            updateRubberWire(mouse);
            setBannerText(`Stepped back one corner.`);
          } else {
            cancelWiring();
          }
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      const mouse = screenToWorld(e.clientX, e.clientY);
      state.lastMouseWorld = mouse;

      if (state.isMarquee) {
        const x1 = Math.min(state.marqueeStart.x, mouse.x);
        const y1 = Math.min(state.marqueeStart.y, mouse.y);
        const w = Math.abs(mouse.x - state.marqueeStart.x);
        const h = Math.abs(mouse.y - state.marqueeStart.y);

        marqueeBox.style.left = `${x1}px`;
        marqueeBox.style.top = `${y1}px`;
        marqueeBox.style.width = `${w}px`;
        marqueeBox.style.height = `${h}px`;

        const newlySelected = [];
        state.components.forEach(c => {
          const cat = CATALOG.find(item => item.id === c.catalogId);
          const cW = cat ? cat.width : 100;
          const cH = cat ? cat.height : 100;
          if (c.x < x1 + w && c.x + cW > x1 && c.y < y1 + h && c.y + cH > y1) {
            newlySelected.push(c.id);
          }
        });
        state.selectedCompIds = newlySelected;
        updateSelectionVisuals();
        return;
      }

      if (state.isPanning) {
        state.panX = e.clientX - state.panStart.x;
        state.panY = e.clientY - state.panStart.y;
        updateTransform();
        return;
      }

      if (state.dragHandle) {
        const wire = state.wires.find(w => w.id === state.dragHandle.wireId);
        if (wire && wire.manualWaypoints && wire.manualWaypoints[state.dragHandle.index]) {
          wire.manualWaypoints[state.dragHandle.index].x = snap(mouse.x, 10);
          wire.manualWaypoints[state.dragHandle.index].y = snap(mouse.y, 10);
          renderWires();
          renderWireHandles(wire);
        }
        return;
      }

      if (state.isDraggingGroup) {
        const dx = snap(mouse.x - state.dragStartMouse.x, 10);
        const dy = snap(mouse.y - state.dragStartMouse.y, 10);

        state.dragCompStarts.forEach(item => {
          const c = state.components.find(x => x.id === item.id);
          if (c) {
            c.x = item.startX + dx;
            c.y = item.startY + dy;

            const el = document.getElementById(`part-${c.id}`);
            if (el) {
              el.style.left = `${c.x}px`;
              el.style.top = `${c.y}px`;
            }
            const pinsCont = document.getElementById(`pins-container-${c.id}`);
            if (pinsCont) {
              pinsCont.style.left = `${c.x}px`;
              pinsCont.style.top = `${c.y}px`;
            }
          }
        });

        renderWires();
        return;
      }

      if (state.wiring) {
        updateRubberWire(mouse);
      }
    });

    window.addEventListener('mouseup', () => {
      if (state.isMarquee) {
        state.isMarquee = false;
        marqueeBox.classList.add('hidden');
        if (state.selectedCompIds.length > 0) {
          selectEntity('component', state.selectedCompIds[0]);
        }
      }

      if (state.isPanning) {
        state.isPanning = false;
        viewportContainer.style.cursor = state.wiring ? 'crosshair' : 'default';
      }

      if (state.isDraggingGroup) {
        const currentSnap = getCircuitSnapshot();
        if (currentSnap !== state.dragInitialSnap) {
          history.past.push(state.dragInitialSnap);
          history.future = [];
          updateUndoRedoButtons();
          persistToLocalStorage();
        }
        state.isDraggingGroup = false;
        state.dragInitialSnap = null;
      }

      if (state.dragHandle && state.dragHandle.initialSnap) {
        const currentSnap = getCircuitSnapshot();
        if (currentSnap !== state.dragHandle.initialSnap) {
          history.past.push(state.dragHandle.initialSnap);
          history.future = [];
          updateUndoRedoButtons();
          persistToLocalStorage();
        }
      }
      state.dragHandle = null;
    });

    viewportContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.1;
      const oldZoom = state.zoom;
      let newZoom = e.deltaY < 0 ? oldZoom * zoomFactor : oldZoom / zoomFactor;
      newZoom = Math.min(Math.max(newZoom, 0.4), 2.2);

      const rect = viewportContainer.getBoundingClientRect();
      const mouseWorldX = (e.clientX - rect.left - state.panX) / oldZoom;
      const mouseWorldY = (e.clientY - rect.top - state.panY) / oldZoom;

      state.panX = e.clientX - rect.left - mouseWorldX * newZoom;
      state.panY = e.clientY - rect.top - mouseWorldY * newZoom;
      state.zoom = Number(newZoom.toFixed(2));
      updateTransform();
    }, { passive: false });

    /* ==========================================================================
       5. COMPONENT DOM CREATION & PIN TERMINALS
       ========================================================================== */
    function spawnComponent(catalogId, customX = null, customY = null) {
      const cat = CATALOG.find(item => item.id === catalogId);
      if (!cat) return;

      saveHistory();

      const center = screenToWorld(viewportContainer.clientWidth / 2, viewportContainer.clientHeight / 2);
      const newComp = {
        id: 'comp_' + Math.random().toString(36).substring(2, 9),
        catalogId,
        customName: cat.name,
        x: customX !== null ? customX : snap(center.x - cat.width / 2, 10),
        y: customY !== null ? customY : snap(center.y - cat.height / 2, 10),
        rotation: 0
      };

      state.components.push(newComp);
      renderComponentDOM(newComp);
      state.selectedCompIds = [newComp.id];
      selectEntity('component', newComp.id);
      updateSelectionVisuals();
      closePartModal();
    }

    function renderComponentDOM(comp) {
      const cat = CATALOG.find(c => c.id === comp.catalogId);
      
      const div = document.createElement('div');
      div.id = `part-${comp.id}`;
      div.className = 'absolute pointer-events-auto canvas-part select-none';
      div.style.left = `${comp.x}px`;
      div.style.top = `${comp.y}px`;
      div.style.width = `${cat.width}px`;
      div.style.height = `${cat.height}px`;
      div.style.transform = `rotate(${comp.rotation || 0}deg)`;
      div.style.transformOrigin = 'center center';

      div.addEventListener('mousedown', (e) => {
        if (e.target.closest('.pin-terminal')) return;

        if (e.shiftKey) {
          if (state.selectedCompIds.includes(comp.id)) {
            state.selectedCompIds = state.selectedCompIds.filter(id => id !== comp.id);
          } else {
            state.selectedCompIds.push(comp.id);
          }
        } else {
          if (!state.selectedCompIds.includes(comp.id)) {
            state.selectedCompIds = [comp.id];
          }
        }

        updateSelectionVisuals();
        selectEntity('component', comp.id);

        const mouse = screenToWorld(e.clientX, e.clientY);
        state.isDraggingGroup = true;
        state.dragInitialSnap = getCircuitSnapshot();
        state.dragStartMouse = mouse;
        state.dragCompStarts = state.selectedCompIds.map(id => {
          const c = state.components.find(x => x.id === id);
          return { id, startX: c ? c.x : 0, startY: c ? c.y : 0 };
        });

        e.stopPropagation();
      });

      const svgContainer = document.createElement('div');
      svgContainer.className = 'w-full h-full pointer-events-none drop-shadow-xl';
      svgContainer.innerHTML = `
        <svg width="${cat.width}" height="${cat.height}" viewBox="0 0 ${cat.width} ${cat.height}" class="overflow-visible">
          ${cat.renderSVG()}
        </svg>
      `;
      div.appendChild(svgContainer);
      componentsLayer.appendChild(div);

      const pinsDiv = document.createElement('div');
      pinsDiv.id = `pins-container-${comp.id}`;
      pinsDiv.className = 'absolute pointer-events-none';
      pinsDiv.style.left = `${comp.x}px`;
      pinsDiv.style.top = `${comp.y}px`;
      pinsDiv.style.width = `${cat.width}px`;
      pinsDiv.style.height = `${cat.height}px`;
      pinsDiv.style.transform = `rotate(${comp.rotation || 0}deg)`;
      pinsDiv.style.transformOrigin = 'center center';

      cat.pins.forEach(pin => {
        const pinEl = document.createElement('div');
        pinEl.id = `pin-${comp.id}-${pin.id}`;
        pinEl.dataset.compId = comp.id;
        pinEl.dataset.pinId = pin.id;
        pinEl.className = 'pin-terminal absolute -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded bg-amber-400 border border-slate-900 flex items-center justify-center shadow pointer-events-auto';
        pinEl.style.left = `${pin.x}px`;
        pinEl.style.top = `${pin.y}px`;
        pinEl.title = `${pin.name} (${pin.type}) - Click to connect wire`;

        pinEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-sm bg-slate-950 block pointer-events-none"></span>`;

        pinEl.addEventListener('mouseenter', () => {
          setBannerText(`Terminal: ${comp.customName} → ${pin.name} [${pin.type}] (Multiple wires allowed)`);
        });
        pinEl.addEventListener('mouseleave', () => {
          if (!state.wiring) setBannerText('Shift+Click or Shift+Drag to multi-select. Drag group to move together.');
        });

        pinEl.onclick = (e) => handlePinClick(comp.id, pin.id, e);
        pinsDiv.appendChild(pinEl);
      });

      pinsInteractionLayer.appendChild(pinsDiv);
    }

    function rotateSelectedComponent() {
      if (state.selectedCompIds.length === 0) return;

      saveHistory();

      state.selectedCompIds.forEach(id => {
        const comp = state.components.find(c => c.id === id);
        if (comp) {
          comp.rotation = ((comp.rotation || 0) + 90) % 360;
          const el = document.getElementById(`part-${comp.id}`);
          if (el) el.style.transform = `rotate(${comp.rotation}deg)`;
          const pinsCont = document.getElementById(`pins-container-${comp.id}`);
          if (pinsCont) pinsCont.style.transform = `rotate(${comp.rotation}deg)`;
        }
      });

      renderWires();
      persistToLocalStorage();
    }

    /* ==========================================================================
       6. SELECTION & DELETION
       ========================================================================== */
    function selectEntity(type, id) {
      state.selectedEntity = type ? { type, id } : null;

      if (type === 'wire') {
        state.selectedCompIds = [];
        const wire = state.wires.find(w => w.id === id);
        renderWireHandles(wire);
      } else {
        wireHandlesGroup.innerHTML = '';
      }

      updateSelectionVisuals();
      renderWires();
      updateNetlistUI();
    }

    function deleteSelected() {
      if (state.selectedCompIds.length > 0) {
        saveHistory();

        state.wires = state.wires.filter(w =>
          !state.selectedCompIds.includes(w.from.compId) && !state.selectedCompIds.includes(w.to.compId)
        );

        state.selectedCompIds.forEach(id => {
          document.getElementById(`part-${id}`)?.remove();
          document.getElementById(`pins-container-${id}`)?.remove();
        });

        state.components = state.components.filter(c => !state.selectedCompIds.includes(c.id));
        state.selectedCompIds = [];
        selectEntity(null);
        updateSelectionVisuals();
        renderWires();
        updateNetlistUI();
        persistToLocalStorage();
        setBannerText("Deleted selected component(s).");
        return;
      }

      if (state.selectedEntity && state.selectedEntity.type === 'wire') {
        saveHistory();
        state.wires = state.wires.filter(w => w.id !== state.selectedEntity.id);
        selectEntity(null);
        renderWires();
        updateNetlistUI();
        persistToLocalStorage();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        state.selectedCompIds = state.components.map(c => c.id);
        updateSelectionVisuals();
        setBannerText(`Selected all ${state.components.length} components.`);
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        copySelectedComponent();
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        e.preventDefault();
        pasteComponent();
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (e.shiftKey) {
          e.preventDefault();
          redo();
        } else {
          e.preventDefault();
          undo();
        }
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
        return;
      }

      if (e.key === 'Backspace' && state.wiring) {
        if (state.wiring.waypoints.length > 1) {
          state.wiring.waypoints.pop();
          state.wiring.forcedAxis = (state.wiring.forcedAxis === 'H') ? 'V' : 'H';
          renderWaypointMarkers();
          setBannerText(`Removed last waypoint.`);
        }
        return;
      }

      if (e.key === 'r' || e.key === 'R') rotateSelectedComponent();
      if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
      if (e.key === 'Escape') {
        cancelWiring();
        state.selectedCompIds = [];
        selectEntity(null);
        updateSelectionVisuals();
        closePartModal();
      }
    });

    function clearWorkbench() {
      if (confirm('Clear entire wiring workbench? This will remove all parts and traces.')) {
        saveHistory();
        state.components = [];
        state.wires = [];
        state.selectedCompIds = [];
        componentsLayer.innerHTML = '';
        pinsInteractionLayer.innerHTML = '';
        renderWires();
        updateNetlistUI();
        selectEntity(null);
        persistToLocalStorage();
      }
    }

    function deleteWireById(wireId) {
      saveHistory();
      state.wires = state.wires.filter(w => w.id !== wireId);

      renderWires();
      updateNetlistUI();

    function copyNetlistText() {
      if (state.wires.length === 0) return;
      const lines = state.wires.map((w, idx) => {
        const from = getPinAbsoluteCoords(w.from.compId, wire.from.pinId);
        const to = getPinAbsoluteCoords(w.to.compId, wire.to.pinId);
        return `#${idx + 1}: ${from?.compName} [${from?.name}] ──[${w.color}]──> ${to?.compName} [${to?.name}]`;
      });
      navigator.clipboard.writeText(lines.join('\n'));
      setBannerText("Copied Netlist table to clipboard!");
      setTimeout(() => setBannerText('Shift+Click or Shift+Drag to multi-select. Drag group to move together.'), 2500);

    /* ==========================================================================
       9. PRINT MODE TOGGLE & ULTRA-HD CRISP PNG EXPORT
       ========================================================================== */
    function togglePrintMode() {
      state.printMode = !state.printMode;
      document.body.classList.toggle('print-mode', state.printMode);
      renderWires();
    }

    function exportDiagramPNG() {
      if (state.components.length === 0) {
        alert("Canvas is empty. Add parts and route wires first.");
        return;
      }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      state.components.forEach(c => {
        const cat = CATALOG.find(item => item.id === c.catalogId);
        minX = Math.min(minX, c.x);
        minY = Math.min(minY, c.y);
        maxX = Math.max(maxX, c.x + cat.width);
        maxY = Math.max(maxY, c.y + cat.height);
      });

      state.wires.forEach(w => {
        const pts = getWireRenderPoints(w);
        if (pts) {
          pts.forEach(p => {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
          });
        }
      });

      const pad = 80;
      minX = Math.floor(minX - pad);
      minY = Math.floor(minY - pad);
      maxX = Math.ceil(maxX + pad);
      maxY = Math.ceil(maxY + pad);

      const w = maxX - minX;
      const h = maxY - minY;

      const exportScale = 3;

      let svgContent = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${w * exportScale}" height="${h * exportScale}" viewBox="${minX} ${minY} ${w} ${h}">
          <defs>
            <pattern id="grid-pat" width="20" height="20" patternUnits="userSpaceOnUse">
              <circle cx="10" cy="10" r="1.2" fill="${state.printMode ? '#cbd5e1' : 'rgba(255,255,255,0.12)'}" />
            </pattern>
          </defs>
          <rect x="${minX}" y="${minY}" width="${w}" height="${h}" fill="${state.printMode ? '#f8fafc' : '#0b0d13'}" />
          <rect x="${minX}" y="${minY}" width="${w}" height="${h}" fill="url(#grid-pat)" />
      `;

      state.components.forEach(c => {
        const cat = CATALOG.find(item => item.id === c.catalogId);
        svgContent += `
          <g transform="translate(${c.x}, ${c.y}) rotate(${c.rotation || 0}, ${cat.width/2}, ${cat.height/2})">
            ${cat.renderSVG()}
          </g>
        `;
      });

      state.wires.forEach(wire => {
        const points = getWireRenderPoints(wire);
        if (!points) return;
        const pathData = pointsToSmoothPath(points, 10);
        const hex = WIRE_PALETTE.find(c => c.id === wire.color)?.hex || '#ef4444';
        const p1 = points[0];
        const p2 = points[points.length - 1];

        svgContent += `
          <g>
            <path d="${pathData}" fill="none" stroke="#000000" stroke-width="5.5" stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="${pathData}" fill="none" stroke="${state.printMode && wire.color === 'black' ? '#000000' : hex}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="${p1.x}" cy="${p1.y}" r="4" fill="${hex}" stroke="#0f172a" stroke-width="1.5" />
            <circle cx="${p2.x}" cy="${p2.y}" r="4" fill="${hex}" stroke="#0f172a" stroke-width="1.5" />
          </g>
        `;
      });

      state.components.forEach(c => {
        const cat = CATALOG.find(item => item.id === c.catalogId);
        svgContent += `
          <g transform="translate(${c.x}, ${c.y}) rotate(${c.rotation || 0}, ${cat.width/2}, ${cat.height/2})">
            ${cat.pins.map(pin => `
              <circle cx="${pin.x}" cy="${pin.y}" r="3.5" fill="#f59e0b" stroke="#0f172a" stroke-width="1.2" />
              <circle cx="${pin.x}" cy="${pin.y}" r="1.5" fill="#0f172a" />
            `).join('')}
          </g>
        `;
      });

      svgContent += `</svg>`;

      const svgBlob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * exportScale;
        canvas.height = h * exportScale;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `iotrace_circuit_diagram_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }

    function initCircuit() {
      const saved = loadFromLocalStorage();
      if (saved) {
        state.components = saved.components || [];
        state.wires = saved.wires || [];
        state.components.forEach(c => renderComponentDOM(c));
        renderWires();
        history.past = [];
        history.future = [];
        updateUndoRedoButtons();
        resetCanvasView();
        selectEntity(null);
        return;
      }

      // Default demo setup: Wemos + Bluepill + LED + Resistor
      spawnComponent('wemos_d1_mini', 100, 240);
      const wemos = state.components[0];

      spawnComponent('stm32_bluepill', 440, 80);
      const bluepill = state.components[1];

      spawnComponent('led_red', 60, 80);
      const led = state.components[2];

      spawnComponent('resistor_1k', 220, 130);
      const resistor = state.components[3];

      const pBlue3v3 = getPinAbsoluteCoords(bluepill.id, 'bp_r_2');
      const pLedAnode = getPinAbsoluteCoords(led.id, 'anode');
      state.wires.push({
        id: 'w1',
        from: { compId: bluepill.id, pinId: 'bp_r_2' },
        to: { compId: led.id, pinId: 'anode' },
        color: 'red',
        manualWaypoints: [
          { x: pBlue3v3.x, y: pBlue3v3.y },
          { x: pBlue3v3.x + 30, y: pBlue3v3.y },
          { x: pBlue3v3.x + 30, y: 30 },
          { x: 26, y: 30 },
          { x: 26, y: pLedAnode.y + 15 },
          { x: pLedAnode.x, y: pLedAnode.y + 15 },
          { x: pLedAnode.x, y: pLedAnode.y }
        ]
      });

      const pLedCathode = getPinAbsoluteCoords(led.id, 'cathode');
      const pResLead1 = getPinAbsoluteCoords(resistor.id, 'r_p1');
      state.wires.push({
        id: 'w2',
        from: { compId: led.id, pinId: 'cathode' },
        to: { compId: resistor.id, pinId: 'r_p1' },
        color: 'green',
        manualWaypoints: [
          { x: pLedCathode.x, y: pLedCathode.y },
          { x: pLedCathode.x, y: pLedCathode.y + 20 },
          { x: 180, y: pLedCathode.y + 20 },
          { x: 180, y: pResLead1.y },
          { x: pResLead1.x, y: pResLead1.y }
        ]
      });

      const pResLead2 = getPinAbsoluteCoords(resistor.id, 'r_p2');
      const pBlueC13 = getPinAbsoluteCoords(bluepill.id, 'bp_l_1');
      state.wires.push({
        id: 'w3',
        from: { compId: resistor.id, pinId: 'r_p2' },
        to: { compId: bluepill.id, pinId: 'bp_l_1' },
        color: 'green',
        manualWaypoints: [
          { x: pResLead2.x, y: pResLead2.y },
          { x: 370, y: pResLead2.y },
          { x: 370, y: pBlueC13.y },
          { x: pBlueC13.x, y: pBlueC13.y }
        ]
      });

      const pWemosD3 = getPinAbsoluteCoords(wemos.id, 'wm_r_4');
      const pBlueB0 = getPinAbsoluteCoords(bluepill.id, 'bp_l_12');
      state.wires.push({
        id: 'w4',
        from: { compId: wemos.id, pinId: 'wm_r_4' },
        to: { compId: bluepill.id, pinId: 'bp_l_12' },
        color: 'orange',
        manualWaypoints: [
          { x: pWemosD3.x, y: pWemosD3.y },
          { x: 370, y: pWemosD3.y },
          { x: 370, y: pBlueB0.y },
          { x: pBlueB0.x, y: pBlueB0.y }
        ]
      });

      history.past = [];
      history.future = [];
      updateUndoRedoButtons();
      persistToLocalStorage();

      renderWires();
      updateNetlistUI();
      selectEntity(null);
      resetCanvasView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupColorPaletteButtons();
      updateTransform();
      initCircuit();
    });
  </script>
</body>
</html>
